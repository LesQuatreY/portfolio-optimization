[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-lab"
version = "0.1.0"
description = "Auditable historical portfolio optimization for an EUR investor"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.11,<2",
  "matplotlib>=3.8,<4", "yfinance>=0.2.65,<1", "msci-data>=1,<2",
  "jupyterlab>=4,<5", "ipykernel>=6,<8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
