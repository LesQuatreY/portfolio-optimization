# Portfolio Lab - shared research configuration.
#
# Single source of truth for BOTH notebooks (portfolio_analysis and portfolio_robustness).
# Edit this file, then "Run All" in each notebook. Loaded by
# portfolio_lab.research.load_research_config(); every value is validated.
#
# Methodological reminders:
# * The final holdout (2020-01-01 onwards) is technically locked; study_end cannot pass it.
# * Every change evaluated on the 2013-2019 validation years is recorded in
#   experiments/registry.jsonl. Re-selecting assets, constraints or estimators until the
#   validation result looks good overfits the validation period.

# Assets the optimizer MAY use directly (display name: registered symbol, see
# src/portfolio_lab/assets.py). Enabled does NOT mean "must be held": the optimizer can give
# any enabled asset 0%. Comment out a line to make an asset ineligible as a direct holding.
# Indirect exposure is unaffected (e.g. Apple stays inside Nasdaq 100, S&P 500 and MSCI World).
universe:
  Apple: AAPL                    # Yahoo adjusted close (dividends reinvested)
  Nasdaq 100: QQQ                # ETF proxy, adjusted close (dividends reinvested)
  MSCI World: MSCI:990100:NETR   # official MSCI World Net Total Return index (USD, unhedged)
  S&P 500: ^SP500TR              # S&P 500 Total Return index
  Dow Jones: DIA                 # ETF proxy, adjusted close (dividends reinvested)
  Gold: GC=F                     # COMEX front-month gold, unadjusted: tracks spot gold (audited vs GLD,
                                 # docs/DATA_AUDIT.md); holding cost below = physical gold ETC fee
  Coca-Cola: KO                  # adjusted close (dividends reinvested)

# Passive benchmark. Loaded even when it is not an eligible asset; never allocated through
# this entry. Equal Weight over the eligible universe is always reported as well.
benchmark:
  name: MSCI World
  symbol: MSCI:990100:NETR

# Synthetic daily-reset leverage: {underlying name: factor > 1}. The leveraged series replaces
# its underlying in the optimizer universe. {} = no leverage.
# Investor decision (phase 5, registry `kind: decision`): NO leveraged product in the main research
# universe. Taken after 2013-2019 results involving the synthetic Nasdaq 100 x2 had been viewed, so it
# is informed by validation results. Leverage support, its tests and past results are preserved; a
# separate leveraged research configuration can re-enable it (e.g. {Nasdaq 100: 2.0}).
leverage: {}

# Running costs of synthetic leverage, accrued on calendar days in the product's native currency:
# annual drag = annual_fee + (factor - 1) * (financing_base[currency] + financing_spread).
# annual_fee: TER of a 2x UCITS ETF, ~0.6% (constant assumption).
leverage_costs:
  annual_fee: 0.006

# Short rates. Each role is a constant annual fraction (e.g. 0.015) or a registered FRED series id,
# used point in time (a value is used only after its publication; never back-filled).
#   risk_free:      EUR cash reference of Sharpe ratios and of the Maximum Sharpe objective
#                   (mean over each training window / evaluation period).
#   financing_base: short rate of the leveraged product's own currency (Nasdaq 100 x2 borrows USD).
#   financing_spread: swap/borrowing spread over that base; ~0.4% approximates the average
#                   3-month LIBOR - T-bill spread over 2001-2019 (assumption).
# No cash position is held, so no interest is ever credited to a portfolio.
rates:
  risk_free: IR3TIB01EZM156N      # euro area 3-month interbank rate, monthly average (OECD via FRED)
  financing_base:
    USD: DTB3                     # US 3-month Treasury bill, daily (FRED)
    EUR: IR3TIB01EZM156N
  financing_spread: 0.004

# Annual holding cost of turning an INDEX series into an investable exposure, accrued on calendar
# days (assumptions; ETFs and stocks priced by Yahoo adjusted closes already embed their own fees):
#   MSCI World: ~0.20% TER of a physical UCITS tracker (the NETR index is already net of withholding tax).
#   S&P 500:    ~0.07% TER + ~0.28% withholding suffered by a UCITS fund on a ~1.9% dividend yield
#               (the TR index reinvests GROSS dividends).
#   Gold:       ~0.25% fee of a physically backed gold ETC (GC=F tracks spot gold before any fee).
holding_costs:
  MSCI World: 0.0020
  S&P 500: 0.0035
  Gold: 0.0025

# Investor policy constraints, applied to EVERY optimized portfolio (frontier, risk profiles,
# Maximum Sharpe, Minimum Volatility, walk-forward folds). Weights are fractions.
# Investor-declared policy constraints (personal preferences, never tuned on results). Edit freely:
# every run records the values and this provenance note in experiments/registry.jsonl.
constraints:
  max_weights: {"Gold": .10, "Apple": .4}     # e.g. {Gold: 0.10, "Nasdaq 100 x2": 0.50}
  min_weights: {}     # only when explicitly required by the investor
  provenance: >-
    Investor-declared preferences (Gold <= 10%, Apple <= 40%), formally confirmed by the investor in
    phase 3, after 2013-2019 validation results of phases 1-2 had been viewed; not pre-registered and
    not selected by optimization.

estimation:
  covariance: ledoit_wolf        # ledoit_wolf | sample
  expected_returns: sample       # sample | bayes_stein
  growth_drift: sample           # sample | estimated (growth objective re-centred on expected_returns)

# Pre-registered estimation-method variants (phase 5 plan), compared on the main universe only.
# Each entry overrides `estimation` keys; {} is the reference method above.
method_variants:
  Moyenne historique (référence): {}
  Bayes-Stein (dérive rétrécie): {expected_returns: bayes_stein, growth_drift: estimated}

# Risk profiles: ceilings on the ESTIMATED annualized volatility (ex-ante, training data).
# They are not drawdown limits and give no guarantee on future volatility or losses.
risk_profiles:
  Prudent: 0.15
  Modéré: 0.20
  Dynamique: 0.30
  Agressif: 0.40
  Très agressif: 0.50

protocol:
  study_end: "2020-01-01"         # exclusive; can never be later than 2020-01-01 (locked holdout)
  development_end: "2013-01-01"   # exclusive end of the development period
  # In-sample analysis window of portfolio_analysis.ipynb:
  #   development -> data before development_end (recommended: validation years stay unseen)
  #   research    -> all data before study_end (descriptive only; overlaps the validation years)
  analysis_window: development

walk_forward:
  window: rolling                 # rolling | expanding
  train_years: 10
  first_test_year: 2013
  last_test_year: 2019
  rebalance: annual               # annual (buy and hold within the year) | daily (legacy constant mix)
  decision_lag_sessions: 1        # decide on the previous close, trade at the next close
  transaction_cost_bps: 10        # one-way cost per unit of traded notional (each buy and each sell pays it)

# Pre-specified universe comparisons: {label: [assets excluded from the universe above]}.
# Keep this list short: every variant evaluated on 2013-2019 is another look at the same years.
# A list = assets made ineligible; {exclude: [...], unlevered: [...]} may also replace a synthetic
# leveraged series by its unleveraged underlying (one variable at a time).
universe_variants:
  Univers complet: []
  Sans Apple: [Apple]                              # Apple ineligible as a direct holding
  Sans Nasdaq 100: [Nasdaq 100]                    # no direct Nasdaq 100 exposure
  Sans Or: [Gold]                                  # Gold ineligible
