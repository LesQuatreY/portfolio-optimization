# Portfolio Lab V2 — contexte de données isolé (stratégies gelées de Portfolio Research)
#
# Ce fichier est lu par portfolio_lab.v2 (settings.load_settings) ; chaque valeur est validée
# (clé inconnue, empreinte manquante ou date de coupure au-delà du 29/12/2023 => erreur explicite).
#
# Rappels :
# * Portfolio Research est en LECTURE SEULE. Seuls les artefacts listés ci-dessous peuvent être lus,
#   et seulement si leur empreinte SHA-256 est identique à la version gelée.
# * La période TEST 2024–2026 est verrouillée : aucun artefact ne peut contenir de date postérieure
#   au 29/12/2023. Cette limite est aussi codée en dur (portfolio_lab/v2/guard.py) : aucun réglage
#   de ce fichier ne peut la lever.
# * Ce contexte V2 est indépendant de l'optimiseur V1 (config/research.yaml, verrou 2020) :
#   les deux jeux de données ne sont jamais mélangés.

research:
  # Dossier Portfolio Research, relatif à la racine de ce projet (ou chemin absolu).
  root: ../Draft/nasdaq_dynamic_exposure_v0
  cutoff: 2023-12-29            # dernière date de développement autorisée (jamais au-delà)
  start: 2014-10-01             # première séance des simulations gelées (fenêtre FULL)
  initial_capital: 100000       # capital normalisé N100 des simulations Research (EUR)
  currency: EUR
  # Référence documentaire du registre d'origine. Non ouvert par V2 : seuls les artefacts autorisés
  # ci-dessous sont lus ; les tests de non-modification comparent leurs empreintes avant/après.
  hash_record: research_final_validation_n07/FREEZE_PROTOCOL.json

